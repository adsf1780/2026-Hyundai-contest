pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositories {
        exclusiveContent {
            forRepository { maven { url 'https://nexus-playground.pleos.ai/repository/maven-releases/' } }
            filter { includeGroupByRegex 'ai[.]pleos[.].*' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = 'EarTalk'
