services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eartalk
      POSTGRES_USER: eartalk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eartalk -d eartalk"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata: